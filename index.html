<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa Workspace</title>
    <!-- Connects your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Visa Workspace</h1>
        <p>Select a destination to track your visa requirements.</p>

        
        <!-- Country Search -->
    <label for="country-input">Destination:</label>
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="country-input" placeholder="Type any country (e.g., Switzerland, Vietnam)..." style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
        <button id="search-btn" style="padding: 10px 16px; border-radius: 8px; border: none; background: #0f766e; color: white; cursor: pointer;">Search</button>
    </div>

        <!-- Visa Details Card (Hidden until a country is picked) -->
        <div id="visa-card" style="display: none;">
            <h2 id="country-title"></h2>
            <p><strong>Visa Type:</strong> <span id="visa-type"></span></p>
            <p><strong>Est. Fee:</strong> <span id="visa-fee"></span></p>
            <p><strong>Processing Time:</strong> <span id="visa-time"></span></p>

            <!-- Progress Bar -->
            <div class="progress-section">
                <p>Checklist Progress: <span id="progress-text">0%</span></p>
                <progress id="progress-bar" value="0" max="100"></progress>
            </div>

            <!-- Document Checklist (JavaScript will fill this in) -->
            <h3>Required Documents</h3>
            <ul id="checklist"></ul>
        </div>
    </div>

    <!-- Connects your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
